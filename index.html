<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Кошик покупок</title>

	<link rel="stylesheet" href="main.css">	
</head>
<body>

<div class="container">
  <div class="left-panel">
    <div class="add-item-bar">
      <input type="text" id="new-item-input" placeholder="Назва товару">
      <button class="btn-add" id="add-btn" data-tooltip="Додати новий товар до списку">Додати</button>
    </div>

    <div id="items-container"></div>
  </div>

  <div class="right-panel">
    <div class="summary-section">
      <h3>Залишилося</h3>
      <div class="tags" id="unbought-tags-container"></div>
    </div>
    
    <div class="summary-section">
      <h3>Куплено</h3>
      <div class="tags" id="bought-tags-container"></div>
    </div>
  </div>
</div>

<div class="student-badge">
  <div class="badge-title">Buy List</div>
  <div class="badge-author">Created by:<br>Олексій</div>
</div>

<script src="main.js"></script>
</body>
</html>
